<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TACTICAL BATCH ENGINE // 360 WAVE HUD</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg: #E2E7F0;
      --panel: #CBD5E1;
      --border: #94A3B8;
      --slate: #1E293B;
      --slate-muted: #64748B;
      --orange: #FF5500;
      --text: #0F172A;
      --white: #FFFFFF;
      --font-mono: 'Consolas', 'Courier New', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-mono); }
    body { background: var(--bg); color: var(--text); padding: 15px; min-height: 100vh; display: flex; flex-direction: column; gap: 15px; }

    header { display: flex; align-items: center; gap: 15px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
    .hud-tag { background: var(--orange); color: var(--white); padding: 4px 10px; font-weight: bold; font-size: 12px; }
    .hud-title { font-weight: bold; font-size: 15px; letter-spacing: 1px; }

    .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; flex: 1; }
    .panel { background: var(--panel); border: 1px solid var(--border); padding: 15px; display: flex; flex-direction: column; gap: 12px; }
    .panel-title { font-size: 12px; font-weight: bold; color: var(--slate); border-bottom: 1px dashed var(--border); padding-bottom: 4px; }

    .mode-switch { display: flex; gap: 5px; }
    .mode-btn { flex: 1; padding: 8px; background: var(--bg); border: 1px solid var(--border); cursor: pointer; font-weight: bold; font-size: 12px; color: var(--slate); }
    .mode-btn.active { background: var(--orange); color: var(--white); border-color: var(--orange); }

    .input-group { display: flex; flex-direction: column; gap: 4px; font-size: 11px; }
    .input-group label { color: var(--slate-muted); font-weight: bold; }
    .input-group input[type="file"] { background: var(--bg); padding: 6px; border: 1px solid var(--border); font-size: 11px; }

    .action-btn { background: var(--orange); color: var(--white); border: none; padding: 12px; font-weight: bold; font-size: 13px; cursor: pointer; letter-spacing: 1px; margin-top: auto; }
    .action-btn:hover { background: #E04B00; }
    .action-btn:disabled { background: var(--border); cursor: not-allowed; }

    #terminal { background: var(--bg); border: 1px solid var(--border); padding: 10px; height: 260px; overflow-y: auto; font-size: 11px; display: flex; flex-direction: column; gap: 4px; }
    .log-entry { line-height: 1.3; }
    .log-entry.warn { color: var(--orange); font-weight: bold; }

    .gauges-deck { background: var(--panel); border: 1px solid var(--border); padding: 15px; display: flex; justify-content: space-around; align-items: center; }
    .gauge-card { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    canvas { width: 110px; height: 110px; }
    .gauge-label { font-size: 10px; font-weight: bold; color: var(--slate-muted); }
  </style>
</head>
<body>

  <header>
    <div class="hud-tag">SYSTEM.RUN // WEB-CORE</div>
    <div class="hud-title">■ 360 WAVE DEV TOOL // HUD BATCH PROCESSOR</div>
  </header>

  <div class="dashboard">
    <div class="panel">
      <div class="panel-title">┌─ MISSION PARAMETERS & PATH INGESTION</div>

      <div class="mode-switch">
        <button id="btn-renamer" class="mode-btn active" onclick="setMode('renamer')">RENAMER MODE</button>
        <button id="btn-organizer" class="mode-btn" onclick="setMode('organizer')">SKU ORGANIZER MODE</button>
      </div>

      <div class="input-group">
        <label>1. INGEST TARGET FILES (PDFs / ASSETS):</label>
        <input type="file" id="targetFiles" multiple accept=".pdf,*/*" />
      </div>

      <div class="input-group">
        <label>2. INGEST CSV MAPPING TABLE(S):</label>
        <input type="file" id="csvFiles" multiple accept=".csv" />
      </div>

      <button id="execBtn" class="action-btn" onclick="executeBatch()">► INITIATE PROCESS & EXPORT ZIP</button>
    </div>

    <div class="panel">
      <div class="panel-title">R4 LIST // TELEMETRY STREAM</div>
      <div id="terminal">
        <div class="log-entry">> HUD CORE ONLINE. AWAITING INGESTION STREAM...</div>
      </div>
    </div>
  </div>

  <div class="gauges-deck">
    <div class="gauge-card">
      <canvas id="gauge1" width="220" height="220"></canvas>
      <div class="gauge-label">MATCH RATIO</div>
    </div>
    <div class="gauge-card">
      <canvas id="gauge2" width="220" height="220"></canvas>
      <div class="gauge-label">BATCH PROGRESS</div>
    </div>
    <div class="gauge-card">
      <canvas id="gauge3" width="220" height="220"></canvas>
      <div class="gauge-label">SUCCESS RATE</div>
    </div>
  </div>

  <script>
    let activeMode = 'renamer';

    function setMode(mode) {
      activeMode = mode;
      document.getElementById('btn-renamer').classList.toggle('active', mode === 'renamer');
      document.getElementById('btn-organizer').classList.toggle('active', mode === 'organizer');
      log(`[*] OPERATION MODE SWITCHED -> ${mode.toUpperCase()}`);
    }

    function log(msg, isWarn = false) {
      const term = document.getElementById('terminal');
      const div = document.createElement('div');
      div.className = `log-entry ${isWarn ? 'warn' : ''}`;
      div.textContent = `> ${msg}`;
      term.appendChild(div);
      term.scrollTop = term.scrollHeight;
    }

    function drawGauge(canvasId, ratio, textCenter) {
      const c = document.getElementById(canvasId);
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, c.width, c.height);

      const cx = c.width / 2, cy = c.height / 2, r = (c.width / 2) - 20;

      for (let i = 0; i < 360; i += 30) {
        let rad = (i * Math.PI) / 180;
        ctx.beginPath();
        ctx.moveTo(cx + (r + 8) * Math.cos(rad), cy + (r + 8) * Math.sin(rad));
        ctx.lineTo(cx + (r + 16) * Math.cos(rad), cy + (r + 16) * Math.sin(rad));
        ctx.strokeStyle = '#94A3B8';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.strokeStyle = '#94A3B8';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(cx, cy, r - 12, Math.PI * 0.8, Math.PI * 1.3);
      ctx.strokeStyle = '#1E293B';
      ctx.lineWidth = 12;
      ctx.stroke();

      if (ratio > 0) {
        ctx.beginPath();
        ctx.arc(cx, cy, r - 6, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * ratio));
        ctx.strokeStyle = '#FF5500';
        ctx.lineWidth = 8;
        ctx.stroke();
      }

      ctx.fillStyle = '#0F172A';
      ctx.font = 'bold 26px Consolas';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(textCenter, cx, cy);
    }

    function initGauges() {
      drawGauge('gauge1', 0, '0%');
      drawGauge('gauge2', 0, '0/0');
      drawGauge('gauge3', 1.0, '100%');
    }
    initGauges();

    async function executeBatch() {
      const targetFiles = document.getElementById('targetFiles').files;
      const csvFiles = document.getElementById('csvFiles').files;

      if (!targetFiles.length || !csvFiles.length) {
        log("ERROR: Select both target files and CSV mapping table(s).", true);
        return;
      }

      const execBtn = document.getElementById('execBtn');
      execBtn.disabled = true;
      const zip = new JSZip();

      try {
        if (activeMode === 'renamer') {
          await runRenamer(targetFiles, csvFiles[0], zip);
        } else {
          await runOrganizer(targetFiles, csvFiles, zip);
        }

        log("Generating compiled ZIP bundle...");
        const blob = await zip.generateAsync({ type: 'blob' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Organized_Bundle_${Date.now()}.zip`;
        a.click();
        log("BATCH COMPLETE. Archive downloaded successfully.");
      } catch (err) {
        log(`CRITICAL FAILURE: ${err.message}`, true);
      } finally {
        execBtn.disabled = false;
      }
    }

    async function runRenamer(files, csvFile, zip) {
      log(`Parsing CSV Map: ${csvFile.name}`);
      const text = await csvFile.text();
      const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      const headers = lines[0].split(',').map(h => h.trim().toLowerCase());

      const skuIdx = headers.indexOf('mapped_sku');
      const bidIdx = headers.indexOf('batch_job_id');

      if (skuIdx === -1 || bidIdx === -1) {
        throw new Error("CSV missing 'mapped_sku' or 'batch_job_id' header columns.");
      }

      const map = {};
      for (let i = 1; i < lines.length; i++) {
        const parts = lines[i].split(',');
        if (parts[bidIdx]) map[parts[bidIdx].trim()] = (parts[skuIdx] || '').trim();
      }

      let renamed = 0;
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const stem = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
        const ext = file.name.substring(file.name.lastIndexOf('.'));
        const lookup = stem.includes('-') ? stem.split('-')[0].trim() : stem;

        if (map[lookup]) {
          const newName = `${map[lookup]} ${stem}${ext}`;
          zip.file(newName, file);
          renamed++;
          log(`RENAMED: ${file.name} -> ${newName}`);
        } else {
          zip.folder('NO_SKU').file(file.name, file);
          log(`NO_SKU: ${file.name}`);
        }

        const prog = (i + 1) / files.length;
        drawGauge('gauge1', renamed / files.length, `${Math.round((renamed / files.length) * 100)}%`);
        drawGauge('gauge2', prog, `${i + 1}/${files.length}`);
      }
    }

    async function runOrganizer(files, csvFiles, zip) {
      log(`Processing across ${csvFiles.length} SKU lists...`);
      const fileList = Array.from(files);
      let matchedCount = 0;

      for (let c = 0; c < csvFiles.length; c++) {
        const csvFile = csvFiles[c];
        const folderName = csvFile.name.replace(/\.csv$/i, '');
        const text = await csvFile.text();
        const skus = new Set(text.split(/[\r\n,]+/).map(s => s.trim()).filter(Boolean));

        const targetFolder = zip.folder(folderName);
        for (const file of fileList) {
          const stem = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
          let matched = false;

          for (const sku of skus) {
            if (stem.startsWith(sku) || stem.includes(sku)) {
              matched = true;
              break;
            }
          }

          if (matched) {
            targetFolder.file(file.name, file);
            matchedCount++;
            log(`ORGANIZED [${folderName}]: ${file.name}`);
          }
        }

        const prog = (c + 1) / csvFiles.length;
        drawGauge('gauge2', prog, `${c + 1}/${csvFiles.length}`);
      }

      drawGauge('gauge1', matchedCount > 0 ? 1 : 0, `${matchedCount} MATCH`);
    }
  </script>
</body>
</html>
